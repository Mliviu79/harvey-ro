<!doctype html>
<!-- A fictional, trimmed stand-in for LinkedIn's current login page: a React
     form with generated ids, no <form> element, and a type=button submit.
     The old #username / #password / button[type=submit] are absent. -->
<html lang="en">
<head><title>LinkedIn Login, Sign in | LinkedIn</title></head>
<body>
<main>
  <section>
    <h1>Sign in</h1>
    <div class="_a1b2">
      <input type="email" hidden id="decoy-email" name="decoy">
      <label for=":r1:">Email or phone</label>
      <input type="email" id=":r1:" name="session_key" autocomplete="username">
      <label for=":r2:">Password</label>
      <input type="password" id=":r2:" name="session_password" autocomplete="current-password">
      <button type="button" id=":r3:">Show</button>
      <a href="/checkpoint/rp/request-password-reset">Forgot password?</a>
      <button type="button" style="display:none">Sign in</button>
      <button type="button" id=":r4:"> Sign in </button>
      <button type="button" id=":r5:">Sign in with Apple</button>
    </div>
  </section>
</main>
</body>
</html>
