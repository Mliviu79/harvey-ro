# The agent: a model that reads Harvey's data through Harvey's own tools
# (harvey/agent/: an MCP server) and answers in the dashboard's chat. It
# runs on your Claude plan, inside Harvey's share of it
# (usage.max_daily_claude_percent): one live Claude process per chat. It
# queues runs (Discover, a registry pull, Find contacts, Verify contacts)
# only under a plan the user approved, within its budget, through the
# pages' own code; Harvey wakes it under that plan (a job on this module's
# lane) when a run finishes, at a time it scheduled, or when one of the
# campaigns it drafted under the plan has news. It saves audiences, drafts
# campaigns for the user to start, has the reply reader draft answers for
# review and adds to the do-not-contact list. It keeps short notes and
# playbooks. No tool sends or approves email, starts or resumes a
# campaign, undoes a do-not-contact entry, merges or changes settings.
id = "agent"
name = "Agent"
description = "A chat that answers questions about Harvey's data, and queues searches and checks under a plan you approve."
set = "core"
kind = "action"
version = "0.1.0"
api = 1
markets = []
requires = []
default_enabled = true
secrets = []

[cost]
as_of = 2026-11-04
usd = 0.0
note = "your Claude plan's quota, within Harvey's share of it"
