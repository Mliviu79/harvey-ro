# The agent: a model that reads Harvey's data through Harvey's own tools
# (harvey/agent/: an MCP server) and answers in the dashboard's chat. It
# runs on your Claude plan, inside Harvey's share of it
# (usage.max_daily_claude_percent): one live Claude process per chat, no
# job. It queues runs (Discover, a registry pull, Find contacts, Verify
# contacts) only under a plan the user approved, within its budget, through
# the pages' own code; no tool sends or approves email, touches campaigns,
# the do-not-contact list, merges or settings.
id = "agent"
name = "Agent"
description = "A chat that answers questions about Harvey's data, and queues searches and checks under a plan you approve."
set = "core"
kind = "action"
version = "0.1.0"
api = 1
markets = []
requires = []
default_enabled = true
secrets = []

[cost]
as_of = 2026-11-04
usd = 0.0
note = "your Claude plan's quota, within Harvey's share of it"
