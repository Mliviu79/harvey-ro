# Reads a company's own website: the homepage, then the pages its menu links
# to (team, about, contact), over plain HTTP or through the browser service
# for JavaScript-only sites. The other website modules read what it fetched.
id = "website"
name = "Website reader"
description = "Reads a company's own site: the homepage and the pages its menu links to."
set = "core"
kind = "enricher"
version = "0.3.0"
api = 1
markets = []
requires = []
default_enabled = true
entry = "harvey.modules.core.website.capabilities"
wraps = ["harvey.collectors.profile"]
secrets = []

[cost]
as_of = 2026-10-30
usd = 0.0
note = "free: the company's own pages"

[[signals]]
code = "CONTACT_FORM_URL"
label = "Contact form available"
category = "verification"
value_type = "text"
collector = "profile"
cost_note = "free (site HTML)"

[[capabilities]]
id = "read_site"
op = "read"
inputs = [["domain"]]
outputs = { records = "pages", facts = ["CONTACT_FORM_URL"], values = ["name"], contacts = ["email", "contact_form", "linkedin", "facebook", "instagram", "whatsapp"] }
cost = { usd = 0.0, per = "company" }

# The ways a company's own site says it can be reached. A social profile is
# kept only when the company's own pages link to it: Harvey never reads the
# social networks themselves (their terms forbid it).
[[contact_kinds]]
kind = "email"
label = "Email"
channel = "email"

[[contact_kinds]]
kind = "contact_form"
label = "Contact form"
channel = "web"

[[contact_kinds]]
kind = "linkedin"
label = "LinkedIn"
channel = "social"

[[contact_kinds]]
kind = "facebook"
label = "Facebook"
channel = "social"

[[contact_kinds]]
kind = "instagram"
label = "Instagram"
channel = "social"

[[contact_kinds]]
kind = "whatsapp"
label = "WhatsApp"
channel = "message"
