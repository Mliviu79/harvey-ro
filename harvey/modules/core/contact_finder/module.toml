# Finds a way to reach every company on file with none: what is on file
# first (a website a registry declares, phones from official sources), then
# the company's own site, and for a company with no website a search by its
# name and town through whichever search modules are on. Searches run only
# inside a spend cap the user set. Core's finder (harvey/finder.py) runs it,
# one company per job on the contacts lane, whatever the Email switch says.
id = "contact_finder"
name = "Contact finder"
description = "Finds an email, a phone or another way to reach every company with none: its own site first, then a search by name and town."
set = "core"
kind = "enricher"
version = "0.1.0"
api = 1
markets = []
requires = ["website"]
default_enabled = true
entry = "harvey.modules.core.contact_finder.capabilities"
wraps = ["harvey.collectors.discover"]
secrets = []
terms_note = "A search's results are read once, in memory, to pick the company's website, and never stored (some search providers' terms forbid keeping results). Only the website and what the company's own site publishes are saved."

# The background's walk through the backlog may also look companies with
# no website up, but only inside the free allowance each search module
# declares ([[free_allowances]]: TinyFish's a minute and an hour, Brave's
# monthly credit), never a paid search without spend.per_day_usd. Off: no
# searches in the background except those a day's budget pays for.
[settings.background_search]
type = "bool"
default = true

# The share of each free allowance the background may take: the rest is
# kept for your own runs (0.5: half of TinyFish's 30 a minute).
[settings.background_share]
type = "float"
default = 0.5
min = 0.05
max = 1.0

# The small yes/no classifier that says which search results could be a
# company's own site, which read site is, and which contacts on it are its
# own (harvey/classify.py). What it asks and through what endpoint is a
# profile's (harvey/classify_profiles.py: Settings → Classifier, or harvey
# contacts classifier); these are the install's caps on every profile's
# calls. An older install's classify_provider, classify_model and the rest
# were taken once into a profile of its own, and are not read any more.

# Calls a day across every task and profile (0: none).
[settings.classify_per_day]
type = "int"
default = 2000
min = 0
max = 100000

# The classifier's USD caps, today and this month (UTC), as text (blank:
# none; the call caps stay). With a profile's price unknown they can't
# count its calls.
[settings.classify_usd_per_day]
type = "str"
default = ""
max_length = 20

[settings.classify_usd_per_month]
type = "str"
default = ""
max_length = 20

# Each task's day cap, as JSON: {"results": {"per_day": 1500}, ...}. A task
# not named has its own cap. Which tasks are asked is which profile each
# is set to.
[settings.classify_tasks]
type = "str"
default = "{}"
max_length = 2000

# The classifier's lane: each profile keeps its own pace in it (its
# per_minute gives the gap: harvey/modules/lanes.py wait_gap, by profile).
# No pace of the lane's own: the profiles are different services, each
# with the limit its own endpoint gives.
[[lanes]]
id = "classify"

[cost]
as_of = 2026-10-30
usd = 0.0
note = "free on file and on the company's own site; a website search costs what the search module charges"

# Looks a company up by its name and town through a search module
# (settings.provider: a provider key whose capability says lookup =
# "website"), and returns the results as candidates for core to pick from.
[[capabilities]]
id = "find_website"
op = "lookup"
inputs = [["name", "locality"], ["name"]]
outputs = { records = "links", ids = ["domain"] }
cost = { usd = 0.0, per = "company", note = "runs through a search module" }
