# Romania's trade registry (ONRC) open data: every firm, its authorised CAEN
# classes, status and administrators, loaded once per dataset into
# data/registry.db and searched there.
id = "onrc"
name = "ONRC trade registry"
description = "Every Romanian firm from the ONRC open data, searched locally."
set = "ro"
kind = "source"
version = "0.3.0"
api = 1
markets = ["RO"]
requires = ["market_ro"]
default_enabled = true
official = true
entry = "harvey.modules.ro.onrc.capabilities"
wraps = ["harvey.registry", "harvey.collectors.onrc"]
secrets = []
attribution = "ONRC open data, data.gov.ro (CC-BY 4.0)"
terms_note = "ONRC open data from data.gov.ro, CC-BY 4.0: credit ONRC. Only a natural person's name and role are kept from the representatives file; a personal numeric code is never kept."

[cost]
as_of = 2026-10-30
usd = 0.0
note = "free (open data download)"

[[signals]]
code = "ACTIVITY_CODE"
label = "Registered activity (CAEN)"
category = "profile"
value_type = "text"
collector = "registry"
cost_note = "free (ONRC open data, data.gov.ro)"
cardinality = "many"
when_known = "source"

[[capabilities]]
id = "registry_sync"
op = "sync"
inputs = []
outputs = { records = "registry", values = ["registry"] }
cost = { usd = 0.0, per = "dataset" }

[[capabilities]]
id = "registry_search"
op = "query"
inputs = [["query", "area"], ["query"], ["area"]]
# A Discover source: ticked on the Descoperă page it queues this job in the
# run's batch, with the filters below as its panel. The estimate is the
# free count of the firms that match.
discover = "registry_pull"
label = "ONRC trade registry"
filters = [
    { key = "words", type = "text", label = "Activity or CAEN code (words, or 8623)" },
    { key = "county", type = "text", label = "County (BV, Brașov; B is Bucharest)" },
    { key = "locality", type = "text", label = "Town" },
    { key = "min_turnover", type = "number", label = "Turnover from (lei)", module = "mf_financials" },
    { key = "max_turnover", type = "number", label = "Turnover up to (lei)", module = "mf_financials" },
    { key = "min_employees", type = "number", label = "Employees from", module = "mf_financials" },
    { key = "max_employees", type = "number", label = "Employees up to", module = "mf_financials" },
    { key = "unknown", type = "choice", options = ["exclude", "include"], label = "Firms with no figures on file", module = "mf_financials" },
    { key = "employer", type = "yesno", label = "Employer (pays wage tax)", module = "mf_taxpayers" },
    { key = "vat", type = "yesno", label = "VAT registered", module = "mf_taxpayers" },
    { key = "micro", type = "yesno", label = "Micro-enterprise tax", module = "mf_taxpayers" },
]
outputs = { records = "companies", ids = ["cui", "reg", "domain"], facts = ["ACTIVITY_CODE", "CONTACT_FOUND", "DECISION_MAKER_TITLE"], values = ["dataset", "report", "codes", "collector", "run_params"] }
cost = { usd = 0.0, per = "query" }

# The same firms read straight from the downloaded files, without the
# local registry database.
[[capabilities]]
id = "registry_import"
op = "query"
inputs = [["area"], ["query", "area"]]
outputs = { records = "companies", ids = ["cui", "reg", "domain"], facts = ["ACTIVITY_CODE", "CONTACT_FOUND", "DECISION_MAKER_TITLE"], values = ["dataset", "report", "codes", "collector", "run_params"] }
cost = { usd = 0.0, per = "query" }
