# DataForSEO: business listings around a point, Google organic rank and
# Google Maps rank, each searched from the city centre.
id = "dataforseo"
name = "DataForSEO"
description = "Business listings, Google rank and Google Maps rank around a city."
set = "original"
kind = "search"
version = "0.3.0"
api = 1
markets = []
requires = ["nominatim"]
default_enabled = true
entry = "harvey.modules.original.dataforseo.capabilities"
wraps = ["harvey.collectors.discover"]
secrets = ["DATAFORSEO_LOGIN", "DATAFORSEO_PASSWORD", "DATAFORSEO_SANDBOX"]

# A Google Business Profile's id ("cid:123", or the place id it was kept
# by before): how a listing found here is known again. Not a legal
# identity: two listings can be one business.
[[identifiers]]
name = "dataforseo.listing"
numeric = false
legal = false
legacy = "external:dataforseo:"

[cost]
as_of = 2026-10-30
free_tier = "$1 signup credit; free sandbox (DATAFORSEO_SANDBOX); $50 minimum deposit to go live"

[[signals]]
code = "SERP_RANK"
label = "Search rank position"
category = "discovery"
value_type = "num"
collector = "discover"
cost_note = "$0.002 per 10 results ranked (paid SERP API, Live endpoint): up to $0.04 a search at the full 200"
keyed_by = "phrase"
cardinality = "many"
when_known = "search"

[[signals]]
code = "IN_LOCAL_PACK"
label = "In the Google local 3-pack"
category = "discovery"
value_type = "num"
collector = "discover"
cost_note = "included in the organic rank search above"
keyed_by = "phrase"
cardinality = "many"
when_known = "search"

[[signals]]
code = "MAPS_RANK"
label = "Google Maps rank position"
category = "discovery"
value_type = "num"
collector = "discover"
cost_note = "$0.002 per 100 Maps results (paid SERP API): up to $0.014 a search at the full 700"
keyed_by = "phrase"
cardinality = "many"
when_known = "search"

[[signals]]
code = "FOUND_IN_SERP"
label = "Discovered via search"
category = "discovery"
value_type = "text"
collector = "discover"
cost_note = "included in the search above"
cardinality = "many"
when_known = "search"

[[signals]]
code = "NO_WEBSITE"
label = "No website at all"
category = "discovery"
value_type = "bool"
collector = "discover"
cost_note = "included in the business listing lookup"
when_known = "search"

[[signals]]
code = "UNCLAIMED_LISTING"
label = "Unclaimed Google listing"
category = "discovery"
value_type = "bool"
collector = "discover"
cost_note = "included in the business listing lookup"
when_known = "search"

[[signals]]
code = "REVIEW_RATING"
label = "Review rating"
category = "discovery"
value_type = "num"
collector = "discover"
cost_note = "included in the business listing lookup"
when_known = "search"

[[signals]]
code = "REVIEW_COUNT"
label = "Number of reviews"
category = "discovery"
value_type = "num"
collector = "discover"
cost_note = "included in the business listing lookup"
when_known = "search"

[[capabilities]]
id = "business_listings"
op = "query"
provider = "dataforseo_listings"
# Finds a company by its name and town (the contact finder's website lookup).
lookup = "website"
inputs = [["query", "area"]]
outputs = { records = "companies", ids = ["domain", "phone", "external"], facts = ["FOUND_IN_SERP", "NO_WEBSITE", "UNCLAIMED_LISTING", "REVIEW_RATING", "REVIEW_COUNT"] }
cost = { usd = 0.012, per = "page", plus_usd = 0.00036, plus_per = "business", note = "every business the search matches, 1,000 a page; the estimate counts them first" }

[[capabilities]]
id = "organic_rank"
op = "query"
provider = "dataforseo_serp"
# Finds a company by its name and town (the contact finder's website lookup).
lookup = "website"
inputs = [["query", "area"]]
outputs = { records = "companies", ids = ["domain"], facts = ["SERP_RANK", "IN_LOCAL_PACK", "FOUND_IN_SERP", "NO_WEBSITE", "REVIEW_RATING", "REVIEW_COUNT"] }
cost = { usd = 0.002, per = "page", note = "10 results a page, up to 200 (DataForSEO's maximum), Live endpoint" }

[[capabilities]]
id = "maps_rank"
op = "query"
provider = "dataforseo_maps"
# Finds a company by its name and town (the contact finder's website lookup).
lookup = "website"
inputs = [["query", "area"]]
outputs = { records = "companies", ids = ["domain", "phone", "external"], facts = ["MAPS_RANK", "FOUND_IN_SERP", "NO_WEBSITE", "UNCLAIMED_LISTING", "REVIEW_RATING", "REVIEW_COUNT"] }
cost = { usd = 0.002, per = "page", note = "100 results a page, up to 700 (DataForSEO's maximum), Live endpoint" }
