# Startups by what their own sites say: Y Combinator, other accelerators,
# a recent raise. The discovery presets find them, the profile reads the
# claim, and the writer uses the startup-founder playbook for them.
id = "startups"
name = "Startups"
description = "Startups by what their own sites say: Y Combinator, other accelerators, a recent raise."
set = "original"
kind = "enricher"
version = "0.3.0"
api = 1
markets = []
requires = ["website"]
default_enabled = false
entry = "harvey.modules.original.startups.capabilities"
wraps = ["harvey.collectors.discover", "harvey.collectors.profile", "harvey.startups"]
secrets = []
terms_note = "Reads only the company's own site. Never ycombinator.com, accelerator directories, Crunchbase, PitchBook or LinkedIn, whose terms forbid scraping."

[cost]
as_of = 2026-10-30
usd = 0.0
note = "free: the homepage, About and press pages; the presets cost what the search module charges"

[[signals]]
code = "YC_BACKED"
label = "Backed by Y Combinator"
category = "profile"
value_type = "bool"
collector = "profile"
cost_note = "free (homepage HTML)"

[[signals]]
code = "ACCELERATOR"
label = "Went through an accelerator"
category = "profile"
value_type = "bool"
collector = "profile"
cost_note = "free (homepage and About page)"

[[signals]]
code = "FUNDING_ROUND"
label = "Announced a funding round"
category = "profile"
value_type = "bool"
collector = "profile"
cost_note = "free (homepage, About, press page)"

[[capabilities]]
id = "startup_claims"
op = "read"
# With the YC preset's hit on file, a page saying nothing doesn't undo it.
inputs = [["pages", "fact:YC_BACKED"], ["pages"]]
outputs = { facts = ["YC_BACKED", "ACCELERATOR", "FUNDING_ROUND"] }
cost = { usd = 0.0, per = "company" }

[[capabilities]]
id = "yc_search"
op = "query"
preset = "yc"
inputs = [["query"]]
outputs = { records = "companies", ids = ["domain"], facts = ["YC_BACKED"] }
cost = { usd = 0.0, per = "search", note = "runs through a search module" }

[[capabilities]]
id = "accelerator_search"
op = "query"
preset = "accelerator"
inputs = [["query"]]
outputs = { records = "companies", ids = ["domain"], facts = ["ACCELERATOR"] }
cost = { usd = 0.0, per = "search", note = "runs through a search module" }

[[capabilities]]
id = "funding_search"
op = "query"
preset = "funding"
inputs = [["query"]]
outputs = { records = "companies", ids = ["domain"] }
cost = { usd = 0.0, per = "search", note = "runs through a search module" }
