# OpenStreetMap through the Overpass API: businesses mapped around a point.
id = "osm"
name = "OpenStreetMap"
description = "Businesses mapped around a point, free."
set = "original"
kind = "search"
version = "0.3.0"
api = 1
markets = []
requires = ["nominatim"]
default_enabled = true
entry = "harvey.modules.original.osm.capabilities"
wraps = ["harvey.collectors.discover"]
secrets = []
terms_note = "OpenStreetMap data is ODbL (credit OpenStreetMap contributors). Overpass is a shared community server: keep requests few and small."

# A mapped element ("node/123", "way/45"): how a business found here is
# known again. Not a legal identity: two elements can be one business.
[[identifiers]]
name = "osm.element"
numeric = false
legal = false
legacy = "external:osm:"

[cost]
as_of = 2026-10-30
usd = 0.0
free_tier = "unlimited, within community rate etiquette"

[[capabilities]]
id = "osm_listings"
op = "query"
provider = "osm"
inputs = [["query", "area"]]
outputs = { records = "companies", ids = ["domain", "phone"], facts = ["FOUND_IN_SERP", "NO_WEBSITE"] }
cost = { usd = 0.0, per = "query", note = "every mapped match in the radius, one request" }
