# nPathi Chat: SMS and WhatsApp messages people send in, read into
# Harvey's conversations (harvey/integrations/npathi.py,
# harvey/agents/messages.py), and the answers to them, each approved by the
# user: Harvey's drafts in the Outbox, the user's own as they write them on
# the Conversations page (harvey/agents/messenger.py). Both run in the
# channels' own loop beside the worker's jobs, apart from email
# (harvey/agents/message_loop.py). Replies only:
# Harvey never writes first on these channels. Romanian law (Law 506/2004
# art. 12) wants consent before a commercial SMS or app message, for a
# company too, and WhatsApp's own rules forbid cold messages.
id = "npathi"
name = "nPathi Chat (SMS, WhatsApp)"
description = "Reads the SMS and WhatsApp messages people send to your nPathi Chat numbers into Harvey's conversations, and sends the answers you approve."
set = "original"
kind = "action"
version = "0.1.0"
api = 1
markets = []
# A number is matched to its firm through the contacts the phones module
# keeps. Answers are approved in the Outbox and written on Conversations,
# which any module with channels brings: the Email module can stay off.
requires = ["phones"]
channels = ["sms", "waba", "wa"]
default_enabled = false
entry = "harvey.integrations.npathi"
secrets = ["NPATHI_API_KEY"]
terms_note = "nPathi Chat bills messages in credits on your own plan. Harvey reads the account, the channels, inbound messages and the opt-out list, adds the people who ask Harvey to stop to that list, and sends only the answers you approve, to people who wrote in."

[cost]
as_of = 2026-11-06
usd = 0.0
note = "reading costs nothing; nPathi Chat bills each answer sent in credits on your plan"

# The install's own address (https://...): nPathi Chat runs per customer,
# so there is no default.
[settings.base_url]
type = "str"
max_length = 200

# Which channels' inbound messages are read. SMS covers the Android SIM,
# phone bridge and GSM modem routes; waba is the official WhatsApp
# Business API; wa a WhatsApp number paired to the account (unofficial).
[settings.receive_sms]
type = "bool"
default = true

[settings.receive_waba]
type = "bool"
default = true

[settings.receive_wa]
type = "bool"
default = false

# Which channels answers are sent on (each answer is still approved by
# you), and from which sender: "<type>:<id>" as the account lists it,
# one a reply can come back to (a SIM, a phone bridge or a GSM modem line;
# a WABA number; a paired WhatsApp account). Off until you choose.
[settings.send_sms]
type = "bool"
default = false

[settings.send_waba]
type = "bool"
default = false

[settings.send_wa]
type = "bool"
default = false

[settings.route_sms]
type = "str"
max_length = 80

[settings.route_waba]
type = "str"
max_length = 80

[settings.route_wa]
type = "str"
max_length = 80

# Answers a day per channel, at most.
[settings.daily_cap_sms]
type = "int"
default = 20
min = 0
max = 500

[settings.daily_cap_waba]
type = "int"
default = 20
min = 0
max = 500

[settings.daily_cap_wa]
type = "int"
default = 20
min = 0
max = 500

# The hours answers go out in (Harvey's own time zone, usage.quiet_hours;
# quiet hours always apply as well).
[settings.send_start]
type = "str"
default = "09:00"
max_length = 5

[settings.send_end]
type = "str"
default = "20:00"
max_length = 5

# Credits caps on the answers sent (UTC day and month; blank: none), and
# what a credit is worth in USD (blank: caps and spend in credits only).
[settings.credits_per_day]
type = "float"
min = 0.0
max = 100000.0

[settings.credits_per_month]
type = "float"
min = 0.0
max = 1000000.0

[settings.usd_per_credit]
type = "float"
min = 0.0
max = 100.0

# One request at a time, at most two a second; the X-RateLimit-* headers
# and Retry-After hold the lane further when nPathi asks.
[[lanes]]
id = "npathi"
min_interval_seconds = 0.5

[[capabilities]]
id = "read_messages"
op = "sync"
inputs = []
outputs = { records = "conversations" }
cost = { usd = 0.0, per = "read" }
