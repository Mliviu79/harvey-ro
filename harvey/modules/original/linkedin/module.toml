# LinkedIn people search through a logged-in browser session. Off unless
# channels.linkedin.enabled is set and LINKEDIN_EMAIL is in .env.
id = "linkedin"
name = "LinkedIn"
description = "People search through a logged-in LinkedIn session."
set = "original"
kind = "enricher"
version = "0.3.0"
api = 1
markets = []
requires = []
default_enabled = false
entry = "harvey.integrations.linkedin.LinkedInAutomation"
secrets = ["LINKEDIN_EMAIL", "LINKEDIN_PASSWORD"]
terms_note = "Automating LinkedIn breaks its terms of service and can get the account restricted or banned. Use an account you can afford to lose."

[cost]
as_of = 2026-10-30
usd = 0.0
note = "free; the risk is the account"

[[capabilities]]
id = "people_search"
op = "query"
inputs = [["query"]]
outputs = { records = "people" }
cost = { usd = 0.0, per = "search" }
