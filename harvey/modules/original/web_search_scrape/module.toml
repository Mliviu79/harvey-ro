# Scout's keyless searches: DuckDuckGo, Bing and Google result pages, and
# the G2 and Clutch category pages, read as HTML without an API.
id = "web_search_scrape"
name = "Keyless web search"
description = "DuckDuckGo, Bing and Google result pages, G2 and Clutch, read without an API."
set = "original"
kind = "search"
version = "0.3.0"
api = 1
markets = []
requires = []
default_enabled = false
entry = "harvey.agents.scout.Scout"
secrets = []
terms_note = "Reads search engines' and directories' result pages without an API. DuckDuckGo, Bing, Google, G2 and Clutch forbid automated access in their terms."

[cost]
as_of = 2026-10-30
usd = 0.0
note = "free, heavily rate-limited by the sites"

[[capabilities]]
id = "html_search"
op = "query"
inputs = [["query"]]
outputs = { records = "links", ids = ["domain"] }
cost = { usd = 0.0, per = "search" }

[[capabilities]]
id = "directories"
op = "query"
inputs = [["query"]]
outputs = { records = "links", ids = ["domain"] }
cost = { usd = 0.0, per = "page" }
