# Hunter.io: a domain's email address pattern, plus a verification
# fallback. Searches are counted against a monthly cap.
id = "hunter"
name = "Hunter"
description = "Looks up a domain's email address pattern, and checks an address when the other verifiers can't."
set = "original"
kind = "enricher"
version = "0.3.0"
api = 1
markets = []
requires = []
default_enabled = true
entry = "harvey.modules.original.hunter.capabilities"
wraps = ["harvey.integrations.email_finder"]
secrets = ["HUNTER_API_KEY", "HUNTER_MONTHLY_SEARCHES"]

[cost]
as_of = 2026-10-30
free_tier = "50 verifications and 25 domain searches a month"

# Hunter's address check, when an address check asks it, and its domain
# search, when an address check looks a domain's pattern up (harvey/
# verify_costs.py): the free ones a month. No paid price is declared: the
# user enters their plan's (usd_hunter, usd_hunter_search); with none, one
# past the free allowance is refused under a USD cap.
[cost.verifiers.hunter]
free_per_month = 50

[cost.verifiers.hunter_search]
free_per_month = 25
kind = "search"

[settings.usd_hunter]
type = "float"
min = 0.0
max = 10.0

[settings.usd_hunter_search]
type = "float"
min = 0.0
max = 10.0

[settings.monthly_searches]
type = "int"
default = 25
env = "HUNTER_MONTHLY_SEARCHES"

[[capabilities]]
id = "domain_search"
op = "lookup"
inputs = [["domain"]]
outputs = { records = "people", facts = ["EMAIL_PATTERN"] }
cost = { usd = 0.0, per = "search", note = "1 of the monthly domain searches" }
